<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio-Lab · Evolution-Sim</title>
<style>
  :root {
    --bg: #07090f;
    --panel: rgba(16, 22, 38, 0.82);
    --accent: #4fe3c1;
    --accent2: #ff6b9d;
    --text: #d8e4f0;
    --muted: #7e8aa3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed;
    top: 16px; left: 16px;
    width: 268px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 18px 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    user-select: none;
  }
  #hud h1 {
    font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
  }
  #hud h1 .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  #hud .sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat {
    background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 8px 10px;
  }
  .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .stat .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .val.accent { color: var(--accent); }
  .stat .val.accent2 { color: var(--accent2); }

  .chart-wrap { margin-bottom: 14px; }
  .chart-wrap .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  #popChart { width: 100%; height: 46px; display: block; border-radius: 8px; background: rgba(255,255,255,0.03); }

  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    flex: 1 1 calc(50% - 3px);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 9px;
    padding: 9px 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: rgba(79,227,193,0.16); border-color: var(--accent); }
  button:active { transform: scale(0.96); }
  button.full { flex: 1 1 100%; }
  button.danger:hover { background: rgba(255,107,157,0.18); border-color: var(--accent2); }

  .slider-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11px; color:var(--muted); }
  .slider-row input[type=range]{ flex:1; accent-color: var(--accent); }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted);
    background: var(--panel); backdrop-filter: blur(10px);
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #legend {
    position: fixed; top: 16px; right: 16px;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 12px 14px; font-size: 11px;
    user-select: none;
  }
  #legend .row { display:flex; align-items:center; gap:8px; margin: 4px 0; color: var(--muted); }
  #legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="hud">
  <h1><span class="dot"></span>BIO-LAB</h1>
  <div class="sub">Künstliche Evolution · Echtzeit</div>

  <div class="stat-grid">
    <div class="stat"><div class="label">Population</div><div class="val accent" id="s-pop">0</div></div>
    <div class="stat"><div class="label">Generation</div><div class="val" id="s-gen">0</div></div>
    <div class="stat"><div class="label">Futter</div><div class="val accent2" id="s-food">0</div></div>
    <div class="stat"><div class="label">Ø Speed-Gen</div><div class="val" id="s-speed">0</div></div>
  </div>

  <div class="chart-wrap">
    <div class="label">Populationsverlauf</div>
    <canvas id="popChart"></canvas>
  </div>

  <div class="controls">
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-feed">🌱 Futter</button>
    <button id="btn-meteor" class="danger">☄️ Meteor</button>
    <button id="btn-mutate">🧬 Mutation+</button>
    <button id="btn-reset" class="full danger">↻ Neustart</button>
  </div>

  <div class="slider-row">
    <span>🐢</span>
    <input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1">
    <span>⚡</span>
  </div>
</div>

<div id="legend">
  <div class="row"><span class="swatch" style="background:#4fe3c1"></span>Kreatur (Farbe = Genom)</div>
  <div class="row"><span class="swatch" style="background:#ff6b9d"></span>Futter</div>
  <div class="row"><span class="swatch" style="background:#ffd866"></span>Energie-Aura</div>
</div>

<div id="hint">Klick = Futter spawnen · Ziehen = Futter-Schwarm · Genome evolvieren von selbst</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Hilfsfunktionen ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;

  // ---------- Konfiguration ----------
  const CFG = {
    startCreatures: 40,
    maxCreatures: 220,
    startFood: 90,
    foodEnergy: 26,
    maxFood: 320,
    foodSpawnRate: 0.55,    // pro Frame Wahrscheinlichkeit
    reproduceCost: 0.55,    // Anteil Energie, der an Kind geht
    baseMutation: 0.08,
  };
  let mutationBoost = 1;
  let timeScale = 1;
  let paused = false;

  // ---------- Genom ----------
  // Jedes Gen beeinflusst Aussehen + Verhalten. Mini-"Gehirn":
  // Wahrnehmung (Futter-Richtung, Artgenossen-Richtung) -> Lenkung.
  function randomGenome() {
    return {
      speed:      rand(0.6, 2.4),   // Max-Geschwindigkeit
      size:       rand(3, 7),       // Körpergröße (größer = mehr Energiebedarf)
      sense:      rand(40, 170),    // Sichtweite
      foodDrive:  rand(0.4, 1.0),   // wie stark Futter anzieht
      social:     rand(-0.6, 0.6),  // Anziehung(+)/Abstoßung(-) zu Artgenossen
      metabolism: rand(0.7, 1.4),   // Energieverbrauch-Faktor
      hue:        rand(0, 360),     // Farbe (vererbt -> Sippen sichtbar)
      efficiency: rand(0.6, 1.2),   // Futterverwertung
    };
  }

  function mutate(g) {
    const m = CFG.baseMutation * mutationBoost;
    const j = (v, lo, hi, scale) => clamp(v + rand(-scale, scale) * m, lo, hi);
    return {
      speed:      j(g.speed, 0.4, 3.2, 1.6),
      size:       j(g.size, 2.5, 9, 4),
      sense:      j(g.sense, 25, 230, 90),
      foodDrive:  j(g.foodDrive, 0.1, 1.2, 0.7),
      social:     j(g.social, -1, 1, 0.7),
      metabolism: j(g.metabolism, 0.5, 1.8, 0.7),
      hue:        (g.hue + rand(-22, 22) * m + 360) % 360,
      efficiency: j(g.efficiency, 0.5, 1.4, 0.5),
    };
  }

  // ---------- Entitäten ----------
  class Creature {
    constructor(x, y, genome, gen) {
      this.x = x; this.y = y;
      this.vx = rand(-1, 1); this.vy = rand(-1, 1);
      this.g = genome;
      this.gen = gen || 0;
      this.energy = 45 + this.g.size * 6;
      this.maxEnergy = 70 + this.g.size * 12;
      this.age = 0;
      this.cooldown = rand(40, 120); // bis Fortpflanzung möglich
      this.wob = rand(0, TAU);
    }

    think(foodGrid, creatures) {
      const g = this.g;
      let ax = 0, ay = 0;

      // nächstes Futter im Sichtradius suchen (via grid)
      let best = null, bestD = g.sense * g.sense;
      const cells = foodGrid.query(this.x, this.y, g.sense);
      for (const f of cells) {
        const dx = f.x - this.x, dy = f.y - this.y;
        const d = dx*dx + dy*dy;
        if (d < bestD) { bestD = d; best = f; }
      }
      if (best) {
        const dx = best.x - this.x, dy = best.y - this.y;
        const inv = 1 / (Math.sqrt(bestD) + 0.001);
        ax += dx * inv * g.foodDrive;
        ay += dy * inv * g.foodDrive;
      }

      // soziale Kraft (Nachbarn) — sparsam gesampelt für Performance
      let sx = 0, sy = 0, n = 0;
      const senseSq = g.sense * g.sense;
      for (let i = 0; i < creatures.length; i += 3) {
        const o = creatures[i];
        if (o === this) continue;
        const dx = o.x - this.x, dy = o.y - this.y;
        const d = dx*dx + dy*dy;
        if (d < senseSq && d > 1) {
          const inv = 1 / Math.sqrt(d);
          sx += dx * inv; sy += dy * inv; n++;
        }
      }
      if (n > 0) { ax += (sx/n) * g.social * 0.5; ay += (sy/n) * g.social * 0.5; }

      // etwas Eigenleben/Wackeln
      this.wob += 0.05;
      ax += Math.cos(this.wob) * 0.15;
      ay += Math.sin(this.wob) * 0.15;

      // Beschleunigung anwenden
      this.vx += ax * 0.12; this.vy += ay * 0.12;
      const sp = Math.hypot(this.vx, this.vy);
      const max = g.speed * 1.6;
      if (sp > max) { this.vx = this.vx/sp*max; this.vy = this.vy/sp*max; }
    }

    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // toroidale Welt (Wrap-around)
      if (this.x < 0) this.x += W; else if (this.x > W) this.x -= W;
      if (this.y < 0) this.y += H; else if (this.y > H) this.y -= H;

      // Energieverbrauch: Grundumsatz + Bewegung, skaliert mit Größe & Metabolismus
      const move = Math.hypot(this.vx, this.vy);
      const cost = (0.04 + move * 0.012) * this.g.metabolism * (0.6 + this.g.size * 0.07);
      this.energy -= cost * dt;
      this.age += dt;
      this.cooldown -= dt;
    }

    eat(f) {
      this.energy = Math.min(this.maxEnergy, this.energy + CFG.foodEnergy * this.g.efficiency);
    }

    canReproduce() {
      return this.cooldown <= 0 && this.energy > this.maxEnergy * 0.7;
    }

    reproduce() {
      const child = this.energy * CFG.reproduceCost;
      this.energy -= child;
      this.cooldown = rand(120, 240);
      const baby = new Creature(
        this.x + rand(-12, 12), this.y + rand(-12, 12),
        mutate(this.g), this.gen + 1
      );
      baby.energy = child;
      return baby;
    }

    draw(ctx) {
      const g = this.g;
      const e = clamp(this.energy / this.maxEnergy, 0, 1);
      const r = g.size;
      const ang = Math.atan2(this.vy, this.vx);

      // Energie-Aura
      if (e > 0.75) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, r + 6 + Math.sin(this.age*0.1)*2, 0, TAU);
        ctx.fillStyle = `hsla(48, 100%, 65%, ${(e-0.75)*0.35})`;
        ctx.fill();
      }

      // Körper
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(ang);
      const light = 30 + e * 35;
      ctx.fillStyle = `hsl(${g.hue}, 70%, ${light}%)`;
      ctx.beginPath();
      ctx.moveTo(r * 1.5, 0);
      ctx.lineTo(-r, -r * 0.8);
      ctx.lineTo(-r * 0.5, 0);
      ctx.lineTo(-r, r * 0.8);
      ctx.closePath();
      ctx.fill();
      // Kern
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.45, 0, TAU);
      ctx.fillStyle = `hsl(${g.hue}, 90%, 80%)`;
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Räumliches Gitter für Futter (Performance) ----------
  class Grid {
    constructor(cell) { this.cell = cell; this.map = new Map(); this.items = []; }
    key(x, y) { return ((x / this.cell) | 0) + ',' + ((y / this.cell) | 0); }
    rebuild(items) {
      this.items = items;
      this.map.clear();
      for (const it of items) {
        const k = this.key(it.x, it.y);
        let arr = this.map.get(k);
        if (!arr) { arr = []; this.map.set(k, arr); }
        arr.push(it);
      }
    }
    query(x, y, radius) {
      const res = [];
      const span = Math.ceil(radius / this.cell);
      const cx = (x / this.cell) | 0, cy = (y / this.cell) | 0;
      for (let i = -span; i <= span; i++)
        for (let j = -span; j <= span; j++) {
          const arr = this.map.get((cx+i) + ',' + (cy+j));
          if (arr) for (const it of arr) res.push(it);
        }
      return res;
    }
  }

  // ---------- Zustand ----------
  let creatures = [];
  let food = [];
  const foodGrid = new Grid(90);
  let topGen = 0;
  let popHistory = [];

  function spawnFood(x, y) {
    if (food.length >= CFG.maxFood) return;
    food.push({ x: x ?? rand(0, W), y: y ?? rand(0, H), r: rand(2.5, 4) });
  }

  function init() {
    creatures = [];
    food = [];
    topGen = 0;
    popHistory = [];
    for (let i = 0; i < CFG.startCreatures; i++)
      creatures.push(new Creature(rand(0, W), rand(0, H), randomGenome(), 0));
    for (let i = 0; i < CFG.startFood; i++) spawnFood();
  }

  // ---------- Simulationsschritt ----------
  function step(dt) {
    foodGrid.rebuild(food);

    // neues Futter sprießt
    if (Math.random() < CFG.foodSpawnRate) spawnFood();

    const newborns = [];
    for (let i = creatures.length - 1; i >= 0; i--) {
      const c = creatures[i];
      c.think(foodGrid, creatures);
      c.update(dt);

      // Futter fressen
      const near = foodGrid.query(c.x, c.y, c.g.size + 8);
      for (let k = near.length - 1; k >= 0; k--) {
        const f = near[k];
        const dx = f.x - c.x, dy = f.y - c.y;
        if (dx*dx + dy*dy < (c.g.size + f.r + 3) ** 2) {
          c.eat(f);
          const idx = food.indexOf(f);
          if (idx >= 0) food.splice(idx, 1);
        }
      }

      // Fortpflanzung
      if (c.canReproduce() && creatures.length + newborns.length < CFG.maxCreatures) {
        newborns.push(c.reproduce());
      }

      // Tod
      if (c.energy <= 0 || c.age > 4000) {
        // hinterlässt etwas Futter (Kreislauf)
        if (Math.random() < 0.6) spawnFood(c.x, c.y);
        creatures.splice(i, 1);
      } else {
        if (c.gen > topGen) topGen = c.gen;
      }
    }
    for (const b of newborns) creatures.push(b);

    // Notfall: Aussterben verhindern -> Seed neu
    if (creatures.length === 0) {
      for (let i = 0; i < 8; i++)
        creatures.push(new Creature(rand(0, W), rand(0, H), randomGenome(), 0));
    }
  }

  // ---------- Rendering ----------
  function render() {
    // Trail-Fade statt clear -> weiche Spuren
    ctx.fillStyle = 'rgba(7, 9, 15, 0.28)';
    ctx.fillRect(0, 0, W, H);

    // Futter
    for (const f of food) {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, TAU);
      ctx.fillStyle = '#ff6b9d';
      ctx.fill();
    }

    // Kreaturen
    for (const c of creatures) c.draw(ctx);
  }

  // ---------- HUD ----------
  const el = id => document.getElementById(id);
  let hudTimer = 0;
  function updateHUD() {
    el('s-pop').textContent = creatures.length;
    el('s-gen').textContent = topGen;
    el('s-food').textContent = food.length;

    // durchschnittliche Speed-Gen der lebenden Population
    let avg = 0;
    for (const c of creatures) avg += c.g.speed;
    avg = creatures.length ? avg / creatures.length : 0;
    el('s-speed').textContent = avg.toFixed(2);

    drawPopChart();
  }

  const pc = el('popChart');
  const pctx = pc.getContext('2d');
  function drawPopChart() {
    const w = pc.width = pc.clientWidth * DPR;
    const h = pc.height = pc.clientHeight * DPR;
    pctx.clearRect(0, 0, w, h);
    if (popHistory.length < 2) return;
    const maxV = Math.max(CFG.maxCreatures, ...popHistory);
    pctx.beginPath();
    for (let i = 0; i < popHistory.length; i++) {
      const x = (i / (popHistory.length - 1)) * w;
      const y = h - (popHistory[i] / maxV) * h * 0.92 - 2;
      i === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    }
    pctx.strokeStyle = '#4fe3c1';
    pctx.lineWidth = 2 * DPR;
    pctx.stroke();
    pctx.lineTo(w, h); pctx.lineTo(0, h); pctx.closePath();
    pctx.fillStyle = 'rgba(79,227,193,0.12)';
    pctx.fill();
  }

  // ---------- Hauptschleife ----------
  let last = performance.now();
  function loop(now) {
    const realDt = Math.min((now - last) / 16.67, 3); // in "Frames"
    last = now;

    if (!paused) {
      const dt = realDt * timeScale;
      // Sim ggf. in Sub-Steps für hohe timeScale
      const steps = Math.max(1, Math.ceil(timeScale));
      for (let s = 0; s < steps; s++) step(dt / steps);
    }
    render();

    hudTimer += realDt;
    if (hudTimer > 18) {
      hudTimer = 0;
      popHistory.push(creatures.length);
      if (popHistory.length > 120) popHistory.shift();
      updateHUD();
    }

    requestAnimationFrame(loop);
  }

  // ---------- Interaktion ----------
  let dragging = false;
  function feedAt(x, y, n = 1) { for (let i = 0; i < n; i++) spawnFood(x + rand(-14,14), y + rand(-14,14)); }
  canvas.addEventListener('mousedown', e => { dragging = true; feedAt(e.clientX, e.clientY, 4); });
  canvas.addEventListener('mousemove', e => { if (dragging) feedAt(e.clientX, e.clientY, 2); });
  window.addEventListener('mouseup', () => dragging = false);
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; feedAt(t.clientX, t.clientY, 5); }, {passive:true});

  el('btn-pause').addEventListener('click', () => {
    paused = !paused;
    el('btn-pause').textContent = paused ? '▶ Weiter' : '⏸ Pause';
  });
  el('btn-feed').addEventListener('click', () => { for (let i = 0; i < 60; i++) spawnFood(); });
  el('btn-meteor').addEventListener('click', () => {
    // Katastrophe: tötet ~60% der Population zufällig -> Selektionsdruck
    const mx = rand(0, W), my = rand(0, H);
    for (let i = creatures.length - 1; i >= 0; i--) {
      if (Math.random() < 0.6) creatures.splice(i, 1);
    }
    food = food.filter(() => Math.random() > 0.5);
  });
  el('btn-mutate').addEventListener('click', () => {
    mutationBoost = mutationBoost >= 4 ? 1 : mutationBoost * 2;
    el('btn-mutate').textContent = `🧬 Mut ×${mutationBoost}`;
  });
  el('btn-reset').addEventListener('click', init);
  el('speed-slider').addEventListener('input', e => { timeScale = parseFloat(e.target.value); });

  // Hinweis ausblenden
  setTimeout(() => { const h = el('hint'); if (h) h.style.opacity = '0'; }, 6000);

  // ---------- Start ----------
  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
